# Template only. No adapter, model, or environment is launched in session one.
schema_version: "1.0"
hardware_assumption:
  gpu: "NVIDIA RTX 5070 Ti"
  vram_gb: 16
  measured: false

clocks:
  source_fps: 60
  analysis_fps: 30
  annotation_fps: 30
  pose_fps: 60

methods:
  object_tracking:
    state: not_run
    environment: "~/.pyenv/versions/muggled_sam"
    adapter: PENDING_SESSION_2
    model_weights: PENDING_DO_NOT_DOWNLOAD
    input: encoded_asset_uri
    outputs:
      points_and_boxes_fps: 30
      masks_fps: 5
      masks_storage: external_or_native_artifact_reference
  hand_pose:
    state: not_run
    environment: "~/.pyenv/versions/wilor"
    adapter: PENDING_SESSION_2
    model_weights: PENDING_DO_NOT_DOWNLOAD
    input: encoded_asset_uri
    outputs:
      landmarks_fps: 60
  action_segmentation:
    state: not_run
    adapter: PENDING_SESSION_2

g1_source_root: PENDING_NO_DATA_PATH_INVENTED
g1_annotation_root: PENDING_NO_DATA_PATH_INVENTED
g1_protocol_manifest: PENDING_NO_DATA_PATH_INVENTED

continuity_policy:
  chunk_duration_seconds: 20.0
  overlap_seconds: 2.0
  max_allowed_gap_seconds: 0.0
  preserve_track_ids: true
  carry_context_across_chunks: true
