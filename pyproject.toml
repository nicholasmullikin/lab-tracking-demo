[project]
name = "battle"
version = "0.1.0"
description = "Inference-free schemas and Rerun export fixtures for a video-understanding method lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic==2.13.5",
    "rerun-sdk==0.37.1",
]

[project.scripts]
battle-export-fixture = "battle.exporter:main"
battle-muggled-smoke = "battle.muggled_smoke:main"
battle-muggled-calibrate = "battle.muggled_calibration:main"
battle-muggled-calibration-web = "battle.muggled_calibration_web:main"
battle-build-ego-static-comparison = "battle.rerun_comparison:main"
battle-mediapipe-hands = "battle.mediapipe_hands:main"
battle-wilor-hands = "battle.wilor_hands:main"
battle-boxmot-track = "battle.boxmot_track:main"
battle-drop-dtw-align = "battle.drop_dtw_align:main"
battle-prepare-human-qa = "battle.human_qa:main"
battle-human-qa-candidates = "battle.human_qa:candidate_main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
