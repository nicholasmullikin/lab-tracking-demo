dependencies = [
    "huggingface_hub>=0.34.0",
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic==2.13.5",
    "pyyaml>=6.0.3",
    "rerun-sdk==0.37.1",
]

