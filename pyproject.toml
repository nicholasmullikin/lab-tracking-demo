[project]
name = "battle"
version = "0.1.0"
description = "Inference-free schemas and Rerun export fixtures for a video-understanding method lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.34.0",
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic==2.13.5",
    "rerun-sdk==0.37.1",
]

[project.scripts]
battle-export-fixture = "battle.exporter:main"
battle-muggled-smoke = "battle.muggled_smoke:main"
battle-muggled-calibrate = "battle.muggled_calibration:main"
battle-muggled-calibration-web = "battle.muggled_calibration_web:main"
battle-build-ego-static-comparison = "battle.rerun_comparison:main"
battle-mediapipe-hands = "battle.mediapipe_hands:main"
battle-wilor-hands = "battle.wilor_hands:main"
battle-stabilize-wilor = "battle.stabilize_wilor:main"
battle-boxmot-track = "battle.boxmot_track:main"
battle-drop-dtw-align = "battle.drop_dtw_align:main"
battle-fine-substep-align = "battle.fine_substep_align:main"
battle-import-external-smoke = "battle.external_smoke_import:main"
battle-grounding-dino-sam2-video = "battle.grounding_dino_sam2_video:main"
battle-samurai-video = "battle.samurai_video:main"
battle-dam4sam-video = "battle.dam4sam_video:main"
battle-athena-calibration-probe = "battle.athena_calibration_probe:main"
battle-athena-fixture-smoke = "battle.athena_triangulation:main"
battle-kineo-nlf = "battle.kineo_nlf:main"
battle-build-exploratory-comparison = "battle.exploratory_comparison:main"
battle-four-part-segmentation = "battle.four_part_segmentation:main"
battle-build-four-part-segmentation-comparison = "battle.four_part_comparison:main"
battle-build-interaction-review = "battle.interaction_review:main"
battle-prepare-human-qa = "battle.human_qa:main"
battle-human-qa-candidates = "battle.human_qa:candidate_main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
